name: Mobile and commerce checks
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - run: npm run typecheck
      - name: Install server dependencies for lint resolution
        run: npm ci --prefix functions --ignore-scripts
      - run: npm run lint
        if: ${{ !cancelled() }}
      - run: npm test
        if: ${{ !cancelled() }}
      - run: npx expo install --check
        if: ${{ !cancelled() }}
      - name: Bundle Android and iOS
        if: ${{ !cancelled() }}
        run: |
          npx expo export --platform android --output-dir dist/android
          npx expo export --platform ios --output-dir dist/ios
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-lock
          path: package-lock.json
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --prefix functions --ignore-scripts
      - run: node --test tests/commerce.test.mjs
      - name: Real Firebase emulator checks
        run: npx --yes firebase-tools emulators:exec --only auth,database,functions --project demo-optovik "node tests/emulator.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-lock
          path: functions/package-lock.json
