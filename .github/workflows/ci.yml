name: Mobile and rules checks
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
        if: ${{ !cancelled() }}
      - name: Unit tests (catalog, cart, orders, phone, i18n)
        run: npm test
        if: ${{ !cancelled() }}
      - run: npx expo install --check
        if: ${{ !cancelled() }}
      - name: Bundle Android and iOS
        if: ${{ !cancelled() }}
        run: |
          npx expo export --platform android --output-dir dist/android
          npx expo export --platform ios --output-dir dist/ios
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Security rules in the Realtime Database emulator
        run: npx --yes firebase-tools@14 emulators:exec --only database --project demo-n99 "node --test tests/rules.emulator.mjs"
