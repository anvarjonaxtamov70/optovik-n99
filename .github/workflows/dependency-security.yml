name: Dependency security
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: dependency-security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Audit the exact mobile and server lockfiles
        run: node scripts/audit-dependencies.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-security
          path: reports/
          retention-days: 14

  candidate:
    # Never deploy or write to GitHub. Only test the phase-one PR's candidate lockfile.
    if: github.event_name == 'pull_request' && github.head_ref == 'hardening/phase-1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prepare compatible dependency candidate
        run: |
          mkdir -p candidate-report
          cp package.json candidate-report/original-package.json
          cp package-lock.json candidate-report/original-lock.json
          # ngrok is used only by the local Expo CLI, not the deployed application.
          node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("package.json","utf8"));p.devDependencies["@expo/ngrok"]=p.dependencies["@expo/ngrok"];delete p.dependencies["@expo/ngrok"];fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\n")'
          npm install --package-lock-only --ignore-scripts --no-audit
          set +e
          npm audit fix --package-lock-only --ignore-scripts --omit=dev --json > candidate-report/audit-fix.json
          status=$?
          set -e
          if [ "$status" -gt 1 ]; then exit "$status"; fi
          cp package.json package-lock.json candidate-report/
          node scripts/dependency-candidate.mjs
      - name: Audit candidate
        run: node scripts/audit-dependencies.mjs
      - name: Install and verify candidate
        run: |
          npm ci --ignore-scripts --no-audit
          npm run typecheck
          npm run lint
          npm test
          npx expo install --check
          npx expo export --platform android --output-dir dist/android
          npx expo export --platform ios --output-dir dist/ios
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-candidate
          path: |
            candidate-report/
            reports/
          retention-days: 14
