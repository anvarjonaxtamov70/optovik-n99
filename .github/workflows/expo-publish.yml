name: Expo Go Publish
# Expo Go'da sinash uchun yangilanish chiqaradi. Natija sahifasidagi "EAS Dashboard" havolasini oching
# va QR kodni telefoningizdagi Expo Go bilan skanerlang.
on:
  workflow_dispatch:
    inputs:
      message:
        description: "Yangilanish izohi"
        type: string
        required: false
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN yo'q. expo.dev → Account settings → Access tokens → yarating va GitHub Secrets ga EXPO_TOKEN nomi bilan qo'shing."
            exit 1
          fi
      - name: Publish to EAS Update (branch production)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          MESSAGE: ${{ inputs.message }}
        run: |
          npx --yes eas-cli@latest update --branch production --message "${MESSAGE:-$(git log -1 --pretty=%s)}" --non-interactive --json > update.json
          node -e "
            const fs = require('fs');
            let url = 'https://expo.dev/accounts/avtoa1/projects/optovik-n99/updates';
            try { const j = JSON.parse(fs.readFileSync('update.json', 'utf8')); const u = Array.isArray(j) ? j[0] : j; if (u && u.group) url += '/' + u.group; } catch (e) { console.log(fs.readFileSync('update.json', 'utf8')); }
            console.log(url);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '## Expo Go\n\nQR kod: ' + url + '\n');
          "
