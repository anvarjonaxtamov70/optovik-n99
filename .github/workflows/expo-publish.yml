name: Expo Go Publish
on:
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Export and Publish to Expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx --yes eas-cli init --id ${{ secrets.EAS_PROJECT_ID }} --non-interactive || true
          npx --yes eas-cli update --branch production --message "Update via GitHub Actions" --non-interactive || npx expo export

