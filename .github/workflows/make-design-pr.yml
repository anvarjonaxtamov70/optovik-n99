name: Yangi Dizaynni Qoshish
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  update-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Fayllarni yozish
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");

          // 1. Theme
          fs.writeFileSync("src/store/theme.ts", `export const colors = {
            primary: "#48C0F8", primaryDark: "#0284C7", primaryLight: "#E0F2FE", primarySoft: "#F0F9FF",
            background: "#FFFFFF", surface: "#FFFFFF", surfaceSecondary: "#F8FAFC", surfaceMuted: "#F1F5F9",
            text: "#0F172A", textSecondary: "#475569", textMuted: "#94A3B8", textInverse: "#FFFFFF",
            border: "#E2E8F0", borderLight: "#F1F5F9", badgeDiscount: "#EF4444", success: "#10B981"
          };
          export const radii = { sm: 8, md: 12, lg: 16, card: 18, banner: 20, pill: 9999 };
          export const shadows = {
            card: { shadowColor: "#0F172A", shadowOffset: { width: 0, height: 4 }, shadowOpacity: 0.06, shadowRadius: 10, elevation: 2 },
            buttonGlow: { shadowColor: "#0284C7", shadowOffset: { width: 0, height: 4 }, shadowOpacity: 0.2, shadowRadius: 8, elevation: 3 },
            badge: { shadowColor: "#0F172A", shadowOffset: { width: 0, height: 2 }, shadowOpacity: 0.08, shadowRadius: 4, elevation: 2 }
          };`);

          // 2. CategoryBar
          fs.writeFileSync("src/components/CategoryBar.tsx", `import React from "react";
          import { StyleSheet, Text, TouchableOpacity, View } from "react-native";
          import { Ionicons } from "@expo/vector-icons";
          import { colors, radii, shadows } from "../store/theme";
          const CATS = [
            { id: "aksessuarlar", label: "Aksessuarlar", icon: "car-sport-outline" },
            { id: "dvigatel", label: "Dvigatel", icon: "hardware-chip-outline" },
            { id: "tormoz", label: "Tormoz", icon: "disc-outline" },
            { id: "elektrika", label: "Elektrika", icon: "battery-charging-outline" },
            { id: "all", label: "Barchasi", icon: "grid-outline" }
          ];
          export const CategoryBar = ({ selectedCategory, onSelectCategory }) => (
            <View style={{ paddingHorizontal: 16, paddingVertical: 10, backgroundColor: colors.background }}>
              <View style={{ flexDirection: "row", justifyContent: "space-between" }}>
                {CATS.map(c => {
                  const sel = selectedCategory === c.id;
                  return (
                    <TouchableOpacity key={c.id} style={{ alignItems: "center", width: "18%" }} onPress={() => onSelectCategory(c.id)}>
                      <View style={[{ width: 52, height: 52, borderRadius: radii.lg, backgroundColor: sel ? colors.primaryDark : colors.primaryLight, alignItems: "center", justifyContent: "center", marginBottom: 6 }, shadows.card]}>
                        <Ionicons name={c.icon} size={23} color={sel ? "#FFF" : colors.text} />
                      </View>
                      <Text style={{ fontSize: 11, fontWeight: sel ? "800" : "600", color: colors.text }}>{c.label}</Text>
                    </TouchableOpacity>
                  );
                })}
              </View>
            </View>
          );`);

          // 3. SearchHeader
          fs.writeFileSync("src/components/SearchHeader.tsx", `import React from "react";
          import { StyleSheet, Text, TextInput, TouchableOpacity, View } from "react-native";
          import { Ionicons } from "@expo/vector-icons";
          import { colors, radii, shadows } from "../store/theme";
          export const SearchHeader = ({ searchQuery, onSearchChange, onOpenFilter, activeFilterCount = 0 }) => (
            <View style={{ paddingHorizontal: 16, paddingTop: 8, paddingBottom: 10, backgroundColor: colors.background }}>
              <View style={{ flexDirection: "row", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
                <View>
                  <Text style={{ fontSize: 22, fontWeight: "900", color: colors.text }}>OPTOVIK N99</Text>
                  <View style={{ width: 68, height: 3, backgroundColor: colors.primary, borderRadius: 2 }} />
                </View>
                <View style={{ flexDirection: "row", alignItems: "center", gap: 4, backgroundColor: colors.surfaceMuted, paddingHorizontal: 10, paddingVertical: 6, borderRadius: radii.pill }}>
                  <Ionicons name="location-sharp" size={15} color={colors.primaryDark} />
                  <Text style={{ fontSize: 13, fontWeight: "700", color: colors.text }}>Samarqand</Text>
                </View>
              </View>
              <View style={{ flexDirection: "row", gap: 10 }}>
                <View style={[{ flex: 1, height: 48, backgroundColor: "#FFF", borderRadius: radii.lg, borderWidth: 1, borderColor: colors.border, flexDirection: "row", alignItems: "center", paddingHorizontal: 14, gap: 8 }, shadows.card]}>
                  <Ionicons name="search-outline" size={19} color={colors.textSecondary} />
                  <TextInput value={searchQuery} onChangeText={onSearchChange} placeholder="Detal yoki aksessuar qidiring" placeholderTextColor={colors.textMuted} style={{ flex: 1, fontSize: 14, color: colors.text }} />
                </View>
                <TouchableOpacity style={[{ width: 48, height: 48, borderRadius: radii.lg, backgroundColor: colors.primaryLight, alignItems: "center", justifyContent: "center" }, shadows.card]} onPress={onOpenFilter}>
                  <Ionicons name="options-outline" size={21} color={colors.text} />
                </TouchableOpacity>
              </View>
            </View>
          );`);

          // 4. PromoBanners
          fs.writeFileSync("src/components/PromoBanners.tsx", `import React from "react";
          import { Image, Text, TouchableOpacity, View } from "react-native";
          import { Ionicons } from "@expo/vector-icons";
          import { colors, radii, shadows } from "../store/theme";
          export const PromoBanners = ({ onSelectGM, onSelectAccessories }) => (
            <View style={{ paddingHorizontal: 16, paddingTop: 6, paddingBottom: 10, gap: 12 }}>
              <TouchableOpacity style={[{ height: 144, borderRadius: radii.banner, backgroundColor: "#E0F2FE", flexDirection: "row", padding: 16, alignItems: "center", borderWidth: 1, borderColor: "#BAE6FD" }, shadows.card]} onPress={onSelectGM}>
                <View style={{ flex: 1.2 }}>
                  <Text style={{ fontSize: 18, fontWeight: "900", color: colors.text }}>GM uchun\\nehtiyot qismlar</Text>
                  <Text style={{ fontSize: 12, color: colors.textSecondary, marginVertical: 6 }}>Cobalt · Gentra · Nexia</Text>
                  <View style={[{ alignSelf: "flex-start", backgroundColor: colors.primary, paddingHorizontal: 12, paddingVertical: 7, borderRadius: radii.pill, flexDirection: "row", alignItems: "center", gap: 5 }, shadows.buttonGlow]}>
                    <Text style={{ fontSize: 12, fontWeight: "700", color: colors.text }}>Qismlarni ko‘rish</Text>
                    <Ionicons name="arrow-forward" size={13} color={colors.text} />
                  </View>
                </View>
                <Image source={{ uri: "https://images.unsplash.com/photo-1549399542-7e3f8b79c341?auto=format&fit=crop&w=600&q=80" }} style={{ flex: 0.9, height: "100%" }} resizeMode="contain" />
              </TouchableOpacity>
            </View>
          );`);

          // 5. ProductCard
          fs.writeFileSync("src/components/ProductCard.tsx", `import React from "react";
          import { Image, StyleSheet, Text, TouchableOpacity, View } from "react-native";
          import { Ionicons } from "@expo/vector-icons";
          import { colors, radii, shadows } from "../store/theme";
          export const ProductCard = ({ product, quantityInCart = 0, isSaved = false, onAddToCart, onIncrement, onDecrement, onToggleSave, onPress }) => {
            const hasDiscount = Boolean(product.eskiNarx && product.eskiNarx > product.narx);
            return (
              <TouchableOpacity style={[{ flex: 1, backgroundColor: "#FFF", borderRadius: radii.card, borderWidth: 1, borderColor: colors.borderLight, overflow: "hidden", marginBottom: 12 }, shadows.card]} activeOpacity={0.9} onPress={onPress}>
                <View style={{ width: "100%", height: 146, backgroundColor: colors.surfaceSecondary, alignItems: "center", justifyContent: "center" }}>
                  <Image source={{ uri: product.rasm || "https://images.unsplash.com/photo-1619642751034-765dfdf7c58e?auto=format&fit=crop&w=600&q=80" }} style={{ width: "90%", height: "90%" }} resizeMode="contain" />
                  <View style={{ position: "absolute", top: 8, left: 8, gap: 6 }}>
                    <View style={[{ width: 30, height: 30, borderRadius: 15, backgroundColor: "#FFF", alignItems: "center", justifyContent: "center" }, shadows.badge]}>
                      <Ionicons name="scale-outline" size={15} color={colors.textSecondary} />
                    </View>
                    {hasDiscount && (
                      <View style={{ backgroundColor: colors.badgeDiscount, paddingHorizontal: 6, paddingVertical: 2, borderRadius: 6 }}>
                        <Text style={{ color: "#FFF", fontSize: 10, fontWeight: "800" }}>-15%</Text>
                      </View>
                    )}
                  </View>
                  <TouchableOpacity style={[{ position: "absolute", top: 8, right: 8, width: 30, height: 30, borderRadius: 15, backgroundColor: "#FFF", alignItems: "center", justifyContent: "center" }, shadows.badge]} onPress={onToggleSave}>
                    <Ionicons name={isSaved ? "heart" : "heart-outline"} size={16} color={isSaved ? colors.badgeDiscount : colors.text} />
                  </TouchableOpacity>
                </View>
                <View style={{ padding: 12 }}>
                  <Text style={{ fontSize: 15, fontWeight: "700", color: colors.text, minHeight: 38 }} numberOfLines={2}>{product.nomi}</Text>
                  <Text style={{ fontSize: 12, color: colors.textSecondary, marginTop: 2 }}>{product.model || "Universal"}</Text>
                  <Text style={{ fontSize: 11, fontWeight: "600", color: colors.success, marginTop: 4 }}>Mavjud</Text>
                  <View style={{ flexDirection: "row", alignItems: "baseline", gap: 6, marginVertical: 8 }}>
                    <Text style={{ fontSize: 16, fontWeight: "800", color: colors.text }}>{product.narx?.toString().replace(/\\B(?=(\\d{3})+(?!\\d))/g, " ")} so‘m</Text>
                  </View>
                  {quantityInCart > 0 ? (
                    <View style={[{ height: 42, backgroundColor: colors.primary, borderRadius: radii.md, flexDirection: "row", alignItems: "center", justifyContent: "space-between", paddingHorizontal: 10 }, shadows.buttonGlow]}>
                      <TouchableOpacity onPress={onDecrement} style={{ padding: 6 }}><Ionicons name="remove" size={18} color={colors.text} /></TouchableOpacity>
                      <Text style={{ fontSize: 15, fontWeight: "800", color: colors.text }}>{quantityInCart}</Text>
                      <TouchableOpacity onPress={onIncrement} style={{ padding: 6 }}><Ionicons name="add" size={18} color={colors.text} /></TouchableOpacity>
                    </View>
                  ) : (
                    <TouchableOpacity style={[{ height: 42, backgroundColor: colors.primary, borderRadius: radii.md, flexDirection: "row", alignItems: "center", justifyContent: "center", gap: 7 }, shadows.buttonGlow]} onPress={onAddToCart}>
                      <Ionicons name="bag-handle-outline" size={17} color={colors.text} />
                      <Text style={{ color: colors.text, fontSize: 14, fontWeight: "700" }}>Savatga</Text>
                    </TouchableOpacity>
                  )}
                </View>
              </TouchableOpacity>
            );
          };`);
          '
      - name: Masterga saqlash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bosh menu va mahsulot kartasi yangilandi" || echo "O'zgarish yo'q"
          git push origin master
