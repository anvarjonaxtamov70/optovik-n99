name: Repair Expo dependencies
on:
  pull_request:
    branches: [master]
    types: [synchronize, opened, reopened]
permissions:
  contents: read
jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'hardening/phase-1'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/phase-1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx expo install --fix
      - run: npx expo install --check
      - run: npm run typecheck && npm run lint && npm test
      - name: Commit dependency repair
        run: |
          git add package.json package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Align Expo SDK dependencies"
          git push origin HEAD:hardening/phase-1
